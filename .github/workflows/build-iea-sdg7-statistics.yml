name: Build IEA SDG7 statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "53 6 18 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/iea-sdg7-indicators.json"
      - "scripts/build_iea_sdg7.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-iea-sdg7-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/iea-sdg7-indicators.json"
      - "scripts/build_iea_sdg7.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-iea-sdg7-statistics.yml"

permissions:
  contents: write

concurrency:
  group: area-statistics-iea-sdg7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_iea_sdg7.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/iea-sdg7-indicators.json >/dev/null

      - name: Build IEA SDG7 statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://peter-alexander.github.io/ks-AreaStatistics/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_iea_sdg7.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/iea-sdg7.log

      - name: Validate IEA SDG7 output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config/iea-sdg7-indicators.json").read_text(encoding="utf-8"))
          provider = json.loads(Path("dist/statistics/iea-sdg7/index.json").read_text(encoding="utf-8"))
          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))

          assert provider["provider"]["id"] == "iea-sdg7"
          assert provider["provider"]["license"] == "CC BY 4.0"
          assert len(provider["indicators"]) == len(config["indicators"]) == 1
          assert any(item["id"] == "iea-sdg7" for item in global_index["providers"])

          dataset = provider["dataset"]
          assert dataset["sourceIndicator"] == "SDG72"
          assert dataset["flow"] == "MRENEW"
          assert dataset["flowLabel"] == "Share of renewables"
          assert dataset["unit"] == "%"
          assert dataset["sourceStartYear"] == 1990
          assert dataset["sourceLatestYear"] >= 2022
          assert dataset["retainedStartYear"] == 1990
          assert set(dataset["ignoredCodes"]).issubset(set(config["allowedIgnoredCodes"]))

          item = provider["indicators"][0]
          cfg = config["indicators"][0]
          coverage = item["coverage"]
          assert item["id"] == "energy.renewable-final-consumption-percent"
          assert item["sourceIndicator"] == "SDG72"
          assert item["availableYears"][0] == 1990
          assert item["availableYears"][-1] >= 2022
          assert coverage["areasWithAnyValue"] >= cfg["minAreasWithAnyValue"]
          assert coverage["areasInDefaultYear"] >= cfg["minAreasInDefaultYear"]

          payload = json.loads(Path("dist/statistics/iea-sdg7", item["path"]).read_text(encoding="utf-8"))
          source = payload["source"]
          assert source["providerId"] == "iea-sdg7"
          assert source["indicator"] == "SDG72"
          assert source["flow"] == "MRENEW"
          assert source["sourceUnit"] == "%"
          assert source["normalization"]["valueMultiplier"] == 1
          assert "fallback" not in source

          for required in cfg["requiredAreas"]:
          	assert any(required in year_values for year_values in payload["values"].values())

          print(
          	f"{item['id']}: defaultYear={item['defaultYear']} "
          	f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          	f"latestYear={coverage['latestYear']} "
          	f"latestAreas={coverage['areasInLatestYear']}"
          )
          print(f"sourceYears={dataset['sourceStartYear']}-{dataset['sourceLatestYear']}")
          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          PY
          du -h dist/statistics/iea-sdg7/index.json
          du -h dist/statistics/iea-sdg7/releases/*/*.json

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iea-sdg7-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-pages.sh provider iea-sdg7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iea-sdg7-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
