name: Build UN WPP statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 3 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/un-wpp-indicators.json"
      - "config/un-wpp-age-indicators.json"
      - "scripts/build_un_wpp.py"
      - "scripts/extend_un_wpp_age.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-un-wpp-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/un-wpp-indicators.json"
      - "config/un-wpp-age-indicators.json"
      - "scripts/build_un_wpp.py"
      - "scripts/extend_un_wpp_age.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-un-wpp-statistics.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: area-statistics-un-wpp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_un_wpp.py
          python -m py_compile scripts/extend_un_wpp_age.py
          python -m json.tool config/un-wpp-indicators.json >/dev/null
          python -m json.tool config/un-wpp-age-indicators.json >/dev/null

      - name: Build UN WPP statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://peter-alexander.github.io/ks-AreaStatistics/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_un_wpp.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/un-wpp.log
          python scripts/extend_un_wpp_age.py --registry "$REGISTRY_URL" 2>&1 | tee -a diagnostics/un-wpp.log

      - name: Show statistics summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dist/statistics/un-wpp/index.json").read_text(encoding="utf-8"))
          print(f"snapshot={payload['activeSnapshot']}")
          print(f"retrievedAt={payload['retrievedAt']}")
          print(
          	f"estimatesThrough={payload['dataset']['estimateEndYear']} "
          	f"projectionsThrough={payload['dataset']['projectionEndYear']} "
          	f"variant={payload['dataset']['projectionVariant']}"
          )
          for indicator in payload["indicators"]:
          	coverage = indicator["coverage"]
          	print(
          		f"{indicator['id']}: defaultYear={indicator['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          		f"years={indicator['availableYears'][0]}-{indicator['availableYears'][-1]}"
          	)
          PY
          du -h dist/statistics/un-wpp/index.json
          du -ch dist/statistics/un-wpp/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: un-wpp-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-pages.sh provider un-wpp

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: un-wpp-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
