name: Build World Bank PIP statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 16 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-pip-indicators.json"
      - "scripts/build_world_bank_pip.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-pip-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-pip-indicators.json"
      - "scripts/build_world_bank_pip.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-pip-statistics.yml"

permissions:
  contents: write

concurrency:
  group: area-statistics-world-bank-pip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --quiet pyarrow

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_world_bank_pip.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/world-bank-pip-indicators.json >/dev/null

      - name: Build World Bank PIP statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://peter-alexander.github.io/ks-AreaStatistics/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank_pip.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/world-bank-pip.log

      - name: Show statistics summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dist/statistics/world-bank-pip/index.json").read_text(encoding="utf-8"))
          print(f"snapshot={payload['activeSnapshot']}")
          print(f"retrievedAt={payload['retrievedAt']}")
          print(f"version={payload['dataset']['version']}")
          print(f"releaseDate={payload['dataset']['releaseDate']}")
          print(f"nowcastYears={payload['dataset']['nowcastYears']}")
          print(f"indicators={len(payload['indicators'])}")
          for indicator in payload["indicators"]:
          	coverage = indicator["coverage"]
          	print(
          		f"{indicator['id']}: defaultYear={indicator['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          		f"years={indicator['availableYears'][0]}-{indicator['availableYears'][-1]}"
          	)
          PY
          du -h dist/statistics/world-bank-pip/index.json
          du -ch dist/statistics/world-bank-pip/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-pip-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-pages.sh provider world-bank-pip

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-pip-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
