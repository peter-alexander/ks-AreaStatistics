name: Build World Bank electrification statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "19 6 17 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-electrification-indicators.json"
      - "config/world-bank-indicators.json"
      - "scripts/build_world_bank_electrification.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-electrification-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-electrification-indicators.json"
      - "config/world-bank-indicators.json"
      - "scripts/build_world_bank_electrification.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-electrification-statistics.yml"

permissions:
  contents: write

concurrency:
  group: area-statistics-world-bank-electrification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_world_bank_electrification.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/world-bank-electrification-indicators.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null

      - name: Build World Bank electrification statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://peter-alexander.github.io/ks-AreaStatistics/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank_electrification.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/world-bank-electrification.log

      - name: Validate World Bank electrification output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config/world-bank-electrification-indicators.json").read_text(encoding="utf-8"))
          provider = json.loads(Path("dist/statistics/world-bank-electrification/index.json").read_text(encoding="utf-8"))
          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))

          assert provider["provider"]["id"] == "world-bank-electrification"
          assert len(provider["indicators"]) == len(config["indicators"]) == 1
          assert any(item["id"] == "world-bank-electrification" for item in global_index["providers"])
          assert provider["dataset"]["bytes"] >= 2_000_000
          assert provider["dataset"]["worksheetRows"] >= 23_000
          assert provider["dataset"]["worksheetColumns"] >= 17
          assert provider["dataset"]["ignoredIso3Codes"] == config["expectedIgnoredIso3Codes"]

          configured = {item["id"]: item for item in config["indicators"]}
          for item in provider["indicators"]:
          	cfg = configured[item["id"]]
          	coverage = item["coverage"]
          	assert item["sourceIndicator"] == cfg["sourceIndicator"]
          	assert item["defaultYear"] >= cfg["minimumDefaultYear"]
          	assert item["availableYears"][-1] >= cfg["minimumLatestYear"]
          	assert coverage["areasWithAnyValue"] >= cfg["minAreasWithAnyValue"]
          	assert coverage["areasInDefaultYear"] >= cfg["minAreasInDefaultYear"]
          	assert coverage["directObservations"] >= cfg["minimumDirectObservations"]
          	assert coverage["fallbackObservations"] > 0
          	assert coverage["observations"] == coverage["directObservations"] + coverage["fallbackObservations"]
          	assert sum(coverage["directNatureCounts"].values()) == coverage["directObservations"]

          	payload = json.loads(Path("dist/statistics/world-bank-electrification", item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["providerId"] == "world-bank-electrification"
          	assert payload["source"]["indicator"] == cfg["sourceIndicator"]
          	assert payload["source"]["distribution"]["provider"] == "Tracking SDG 7"
          	assert payload["source"]["sheet"] == "UN reporting"
          	assert payload["source"]["filters"] == config["sourceInvariants"]
          	assert payload["source"]["fallback"]["providerId"] == "world-bank"
          	assert payload["source"]["fallback"]["indicator"] == cfg["fallbackWdiIndicator"]
          	assert payload["source"]["fallback"]["maximumYear"] == config["wdiFallback"]["maximumYear"]

          	metadata = payload["observationMetadata"]
          	fallback_count = 0
          	direct_count = 0
          	fallback_years = set()
          	for year, year_values in metadata.items():
          		for observation in year_values.values():
          			if observation.get("fallback") is True:
          				fallback_count += 1
          				fallback_years.add(int(year))
          				assert observation["sourceProviderId"] == "world-bank"
          				assert observation["sourceIndicator"] == cfg["fallbackWdiIndicator"]
          			else:
          				direct_count += 1
          				assert observation["natureCode"] in config["natureLabels"]
          				assert observation["natureLabel"] == config["natureLabels"][observation["natureCode"]]
          	assert fallback_count == coverage["fallbackObservations"]
          	assert direct_count == coverage["directObservations"]
          	assert fallback_years
          	assert max(fallback_years) <= config["wdiFallback"]["maximumYear"]

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(
          	f"{item['id']}: defaultYear={item['defaultYear']} "
          	f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          	f"years={item['availableYears'][0]}-{item['availableYears'][-1]} "
          	f"direct={coverage['directObservations']} fallback={coverage['fallbackObservations']}"
          )
          PY
          du -h dist/statistics/world-bank-electrification/index.json
          du -ch dist/statistics/world-bank-electrification/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-electrification-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-pages.sh provider world-bank-electrification

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-electrification-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
