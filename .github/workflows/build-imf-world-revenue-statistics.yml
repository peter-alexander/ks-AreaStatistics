name: Build IMF WoRLD revenue statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 17 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/imf-world-revenue-indicators.json"
      - "scripts/build_imf_world_revenue.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-imf-world-revenue-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/imf-world-revenue-indicators.json"
      - "scripts/build_imf_world_revenue.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-imf-world-revenue-statistics.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: area-statistics-imf-world-revenue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_imf_world_revenue.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/imf-world-revenue-indicators.json >/dev/null
          git diff --check

      - name: Build IMF WoRLD revenue statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://peter-alexander.github.io/ks-AreaStatistics/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_imf_world_revenue.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/imf-world-revenue.log

      - name: Validate IMF WoRLD revenue statistics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          provider_dir = Path("dist/statistics/imf-world-revenue")
          provider = json.loads((provider_dir / "index.json").read_text(encoding="utf-8"))
          assert provider["provider"]["id"] == "imf-world-revenue"
          assert provider["provider"]["name"] == "IWF WoRLD – Staatseinnahmen & Steuern"
          assert len(provider["indicators"]) == 14, len(provider["indicators"])
          assert provider["dataset"]["sourceRelease"] == "2026"
          assert provider["dataset"]["sourceRows"] >= 8500, provider["dataset"]["sourceRows"]
          assert provider["dataset"]["sourceCountries"] >= 195, provider["dataset"]["sourceCountries"]
          assert provider["dataset"]["firstYear"] <= 1980, provider["dataset"]["firstYear"]
          assert provider["dataset"]["latestYear"] == 2024, provider["dataset"]["latestYear"]
          assert provider["dataset"]["excludedResidualColumns"] == ["NonTaxOth", "TaxIncO", "TaxOth", "TaxSalUnal"]
          assert len(provider["dataset"]["workbookSha256"]) == 64

          expected = {
          	"fiscal.imf-world-total-revenue-percent-gdp": {"source": "TotRev", "start": 1980, "minAny": 190, "minDefault": 185, "minObs": 5900},
          	"fiscal.imf-world-tax-revenue-percent-gdp": {"source": "TaxRev", "start": 1980, "minAny": 190, "minDefault": 185, "minObs": 5800},
          	"fiscal.imf-world-income-profit-taxes-percent-gdp": {"source": "TaxInc", "start": 1980, "minAny": 185, "minDefault": 145, "minObs": 5300},
          	"fiscal.imf-world-personal-income-taxes-percent-gdp": {"source": "TaxIncI", "start": 1980, "minAny": 160, "minDefault": 115, "minObs": 4300},
          	"fiscal.imf-world-corporate-income-taxes-percent-gdp": {"source": "TaxIncC", "start": 1980, "minAny": 165, "minDefault": 120, "minObs": 4400},
          	"fiscal.imf-world-property-taxes-percent-gdp": {"source": "TaxPro", "start": 1980, "minAny": 125, "minDefault": 85, "minObs": 3150},
          	"fiscal.imf-world-sales-production-taxes-percent-gdp": {"source": "TaxSal", "start": 1980, "minAny": 185, "minDefault": 140, "minObs": 5150},
          	"fiscal.imf-world-general-sales-taxes-percent-gdp": {"source": "TaxSalG", "start": 1980, "minAny": 165, "minDefault": 120, "minObs": 4050},
          	"fiscal.imf-world-excise-taxes-percent-gdp": {"source": "TaxSalExc", "start": 1980, "minAny": 160, "minDefault": 115, "minObs": 4000},
          	"fiscal.imf-world-trade-taxes-percent-gdp": {"source": "TaxTra", "start": 1980, "minAny": 180, "minDefault": 140, "minObs": 5100},
          	"fiscal.imf-world-social-contributions-percent-gdp": {"source": "SocialCon", "start": 1980, "minAny": 120, "minDefault": 85, "minObs": 3400},
          	"fiscal.imf-world-grants-percent-gdp": {"source": "Grants", "start": 1980, "minAny": 165, "minDefault": 130, "minObs": 4800},
          	"fiscal.imf-world-other-revenue-percent-gdp": {"source": "RevOth", "start": 1980, "minAny": 185, "minDefault": 145, "minObs": 5550},
          	"fiscal.imf-world-extractive-nontax-revenue-percent-gdp": {"source": "NonTaxRes", "start": 1986, "minAny": 65, "minDefault": 55, "minObs": 1600},
          }
          by_id = {item["id"]: item for item in provider["indicators"]}
          assert set(by_id) == set(expected), set(by_id)

          for indicator_id, rules in expected.items():
          	item = by_id[indicator_id]
          	assert item["frequency"] == "annual"
          	assert item["unit"]["id"] == "percent-of-gdp"
          	assert item["classification"]["type"] == "fixed"
          	assert len(item["classification"]["breaks"]) == 6
          	assert item["availableYears"][0] == rules["start"], (indicator_id, item["availableYears"][0])
          	assert item["availableYears"][-1] == 2024, (indicator_id, item["availableYears"][-1])
          	assert item["defaultYear"] == 2024, (indicator_id, item["defaultYear"])
          	assert item["coverage"]["areasWithAnyValue"] >= rules["minAny"], (indicator_id, item["coverage"])
          	assert item["coverage"]["areasInDefaultYear"] >= rules["minDefault"], (indicator_id, item["coverage"])
          	assert item["coverage"]["observations"] >= rules["minObs"], (indicator_id, item["coverage"])
          	payload = json.loads((provider_dir / item["path"]).read_text(encoding="utf-8"))
          	assert payload["source"]["providerId"] == "imf-world-revenue"
          	assert payload["source"]["indicator"] == rules["source"]
          	assert payload["source"]["sourceRelease"] == "2026"
          	assert payload["source"]["timeCoverage"]["endYear"] == 2024
          	assert payload["source"]["workbookSha256"] == provider["dataset"]["workbookSha256"]
          	assert "General Government" in payload["source"]["governmentCoverage"]
          	assert "fallback" not in payload["source"]

          tax = json.loads((provider_dir / by_id["fiscal.imf-world-tax-revenue-percent-gdp"]["path"]).read_text(encoding="utf-8"))
          assert "excludes social contributions" in tax["source"]["taxConcept"]
          for area_id in ("country:AUT", "country:DEU", "country:USA", "country:IND"):
          	assert area_id in tax["values"]["2024"], area_id

          social = json.loads((provider_dir / by_id["fiscal.imf-world-social-contributions-percent-gdp"]["path"]).read_text(encoding="utf-8"))
          assert social["values"]["2024"]["country:IND"] == 0, social["values"]["2024"]["country:IND"]

          resource = json.loads((provider_dir / by_id["fiscal.imf-world-extractive-nontax-revenue-percent-gdp"]["path"]).read_text(encoding="utf-8"))
          assert resource["coverage"]["areasInDefaultYear"] >= 55
          assert "fallback" not in resource["source"]

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          print(f"workbookSha256={provider['dataset']['workbookSha256']}")
          print(f"indicators={len(provider['indicators'])}")
          for item in provider["indicators"]:
          	coverage = item["coverage"]
          	print(
          		f"{item['id']}: defaultYear={item['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          		f"years={item['availableYears'][0]}-{item['availableYears'][-1]} "
          		f"observations={coverage['observations']}"
          	)
          PY
          du -h dist/statistics/imf-world-revenue/index.json
          du -ch dist/statistics/imf-world-revenue/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imf-world-revenue-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-pages.sh provider imf-world-revenue

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: imf-world-revenue-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
