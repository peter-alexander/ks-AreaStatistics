# workflow_dispatch is retained for targeted retries after GitHub Actions startup failures.
name: Build World Bank WDI statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-indicators.json"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/world-bank-indicators.json"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-world-bank-statistics.yml"

permissions:
  contents: write

concurrency:
  group: area-statistics-world-bank-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_world_bank.py

      - name: Build World Bank WDI statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://peter-alexander.github.io/ks-AreaStatistics/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_world_bank.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/world-bank.log

      - name: Show statistics summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("dist/statistics/world-bank/index.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(f"snapshot={payload['activeSnapshot']}")
          print(f"retrievedAt={payload['retrievedAt']}")
          for indicator in payload["indicators"]:
          	coverage = indicator["coverage"]
          	print(
          		f"{indicator['id']}: "
          		f"defaultYear={indicator['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/"
          		f"{coverage['registryAreas']} "
          		f"years={indicator['availableYears'][0]}-"
          		f"{indicator['availableYears'][-1]}"
          	)
          PY
          du -h dist/statistics/world-bank/index.json
          du -h dist/statistics/world-bank/releases/*/*.json

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-pages.sh provider world-bank

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: world-bank-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
