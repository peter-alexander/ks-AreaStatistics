# workflow_dispatch is retained for targeted retries after GitHub Actions startup failures.
name: Build EDGAR statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 19 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/edgar-indicators.json"
      - "config/world-bank-indicators.json"
      - "scripts/build_edgar.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-edgar-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/edgar-indicators.json"
      - "config/world-bank-indicators.json"
      - "scripts/build_edgar.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-edgar-statistics.yml"

permissions:
  contents: write

concurrency:
  group: area-statistics-edgar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --quiet "openpyxl>=3.1,<4"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_edgar.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/edgar-indicators.json >/dev/null
          python -m json.tool config/world-bank-indicators.json >/dev/null

      - name: Build EDGAR statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://peter-alexander.github.io/ks-AreaStatistics/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_edgar.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/edgar.log

      - name: Validate EDGAR output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config/edgar-indicators.json").read_text(encoding="utf-8"))
          provider = json.loads(Path("dist/statistics/edgar/index.json").read_text(encoding="utf-8"))
          global_index = json.loads(Path("dist/statistics/index.json").read_text(encoding="utf-8"))

          assert provider["provider"]["id"] == "edgar"
          assert len(provider["indicators"]) == len(config["indicators"]) == 2
          assert any(item["id"] == "edgar" for item in global_index["providers"])
          assert provider["dataset"]["bytes"] >= 4_000_000
          assert provider["dataset"]["worksheetRows"] >= 4_800
          assert provider["dataset"]["worksheetColumns"] >= 60
          assert provider["dataset"]["excludedCombinedAreas"] == config["excludedCombinedAreas"]
          assert provider["dataset"]["workbookMetadata"]["gwp"] == "IPCC AR5 GWP-100"
          assert provider["dataset"]["workbookMetadata"]["unit"] == "Mt CO₂eq/yr"

          configured = {item["id"]: item for item in config["indicators"]}
          expected_substances = {item["sourceIndicator"] for item in config["indicators"]}
          assert expected_substances == {"GWP_100_AR5_CH4", "GWP_100_AR5_N2O"}

          for item in provider["indicators"]:
            cfg = configured[item["id"]]
            coverage = item["coverage"]
            assert item["sourceIndicator"] == cfg["sourceIndicator"]
            assert item["defaultYear"] >= cfg["minimumDefaultYear"]
            assert item["availableYears"][-1] >= cfg["minimumLatestYear"]
            assert coverage["areasWithAnyValue"] >= cfg["minAreasWithAnyValue"]
            assert coverage["areasInDefaultYear"] >= cfg["minAreasInDefaultYear"]
            assert coverage["areasInLatestYear"] == 200
            assert coverage["directAreas"] == 200
            assert coverage["directObservations"] >= cfg["minimumDirectObservations"]
            assert coverage["fallbackObservations"] > 0
            assert coverage["observations"] == coverage["directObservations"] + coverage["fallbackObservations"]

            payload = json.loads(Path("dist/statistics/edgar", item["path"]).read_text(encoding="utf-8"))
            assert payload["source"]["providerId"] == "edgar"
            assert payload["source"]["indicator"] == cfg["sourceIndicator"]
            assert payload["source"]["sheet"] == "GHG_by_sector_and_country"
            assert payload["source"]["fallback"]["providerId"] == "world-bank"
            assert payload["source"]["fallback"]["indicator"] == cfg["fallbackWdiIndicator"]
            assert payload["source"]["fallback"]["maximumYear"] == 2024
            assert set(payload["source"]["filters"]["excludedCombinedAreas"]) == {"CHE", "ESP", "FRA", "ISR", "ITA", "SDN"}

            metadata = payload["observationMetadata"]
            fallback_count = 0
            fallback_years = set()
            for year, year_values in metadata.items():
              for observation in year_values.values():
                assert observation["fallback"] is True
                assert observation["sourceProviderId"] == "world-bank"
                assert observation["sourceIndicator"] == cfg["fallbackWdiIndicator"]
                fallback_count += 1
                fallback_years.add(int(year))
            assert fallback_count == coverage["fallbackObservations"]
            assert fallback_years
            assert max(fallback_years) <= config["wdiFallback"]["maximumYear"]
            assert "2025" not in metadata

            print(
              f"{item['id']}: defaultYear={item['defaultYear']} "
              f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
              f"years={item['availableYears'][0]}-{item['availableYears'][-1]} "
              f"direct={coverage['directObservations']} fallback={coverage['fallbackObservations']}"
            )

          print(f"snapshot={provider['activeSnapshot']}")
          print(f"retrievedAt={provider['retrievedAt']}")
          PY
          du -h dist/statistics/edgar/index.json
          du -ch dist/statistics/edgar/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edgar-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-pages.sh provider edgar

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edgar-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
