name: Build UNESCO UIS statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "31 5 14 * *"
  pull_request:
    paths:
      - "config/statistics-providers.json"
      - "config/unesco-uis-indicators.json"
      - "scripts/build_unesco_uis.py"
      - "scripts/build_unesco_uis_entry.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-unesco-uis-statistics.yml"
  push:
    branches:
      - main
    paths:
      - "config/statistics-providers.json"
      - "config/unesco-uis-indicators.json"
      - "scripts/build_unesco_uis.py"
      - "scripts/build_unesco_uis_entry.py"
      - "scripts/build_world_bank.py"
      - ".github/scripts/deploy-world-bank-statistics.sh"
      - ".github/workflows/build-unesco-uis-statistics.yml"

permissions:
  contents: write

concurrency:
  group: area-statistics-unesco-uis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scripts
        run: |
          python -m py_compile scripts/build_unesco_uis.py scripts/build_unesco_uis_entry.py scripts/build_world_bank.py
          python -m json.tool config/statistics-providers.json >/dev/null
          python -m json.tool config/unesco-uis-indicators.json >/dev/null

      - name: Build UNESCO UIS statistics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p diagnostics
          REGISTRY_URL="https://peter-alexander.github.io/ks-AreaStatistics/AreaStatistics/area-registry-countries.json?build=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_unesco_uis_entry.py --registry "$REGISTRY_URL" 2>&1 | tee diagnostics/unesco-uis.log

      - name: Show statistics summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("dist/statistics/unesco-uis/index.json").read_text(encoding="utf-8"))
          print(f"snapshot={payload['activeSnapshot']}")
          print(f"retrievedAt={payload['retrievedAt']}")
          print(f"indicators={len(payload['indicators'])}")
          for dataset_id, dataset in payload["datasets"].items():
          	print(
          		f"dataset={dataset_id} sourceYears={dataset['sourceStartYear']}-{dataset['sourceLatestYear']} "
          		f"selected={len(dataset['selectedIndicators'])}"
          	)
          for indicator in payload["indicators"]:
          	coverage = indicator["coverage"]
          	print(
          		f"{indicator['id']}: defaultYear={indicator['defaultYear']} "
          		f"areas={coverage['areasInDefaultYear']}/{coverage['registryAreas']} "
          		f"years={indicator['availableYears'][0]}-{indicator['availableYears'][-1]}"
          	)
          PY
          du -h dist/statistics/unesco-uis/index.json
          du -ch dist/statistics/unesco-uis/releases/*/*.json | tail -n 1

      - name: Upload statistics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unesco-uis-statistics-${{ github.sha }}
          path: dist/statistics/
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/publish-pages.sh provider unesco-uis

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unesco-uis-statistics-diagnostics-${{ github.sha }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
